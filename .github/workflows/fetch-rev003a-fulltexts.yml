name: fetch-rev003a-fulltexts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write

jobs:
  fetch-and-register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-intake branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Stop when intake is already present
        id: gate
        shell: bash
        run: |
          if test -f imports/raw/literature/REV-003A/SRC-0010_khebour_et_al_2024_lrec_coling.pdf; then
            echo 'already_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install PDF inspection tools
        if: steps.gate.outputs.already_present == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download exact full-text sources
        if: steps.gate.outputs.already_present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          out='imports/raw/literature/REV-003A'
          mkdir -p "$out"

          curl --fail --location --retry 5 --retry-delay 2 \
            'https://homepages.inf.ed.ac.uk/alex/papers/londial.pdf' \
            --output "$out/SRC-0002_asher_lascarides_2008_londial.pdf"

          curl --fail --location --retry 5 --retry-delay 2 \
            'https://aclanthology.org/W15-0131.pdf' \
            --output "$out/SRC-0003_venant_asher_2015_iwcs.pdf"

          curl --fail --location --retry 5 --retry-delay 2 \
            'https://aclanthology.org/2024.lrec-main.318.pdf' \
            --output "$out/SRC-0010_khebour_et_al_2024_lrec_coling.pdf"

      - name: Verify identities and page counts
        if: steps.gate.outputs.already_present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          out='imports/raw/literature/REV-003A'

          test "$(pdfinfo "$out/SRC-0002_asher_lascarides_2008_londial.pdf" | awk '/^Pages:/ {print $2}')" = '8'
          test "$(pdfinfo "$out/SRC-0003_venant_asher_2015_iwcs.pdf" | awk '/^Pages:/ {print $2}')" = '11'
          test "$(pdfinfo "$out/SRC-0010_khebour_et_al_2024_lrec_coling.pdf" | awk '/^Pages:/ {print $2}')" = '16'

          pdftotext -f 1 -l 1 "$out/SRC-0002_asher_lascarides_2008_londial.pdf" - | grep -F 'Commitments, Beliefs and Intentions in Dialogue'
          pdftotext -f 1 -l 1 "$out/SRC-0003_venant_asher_2015_iwcs.pdf" - | grep -F 'Dynamics of Public Commitments in Dialogue'
          pdftotext -f 1 -l 1 "$out/SRC-0010_khebour_et_al_2024_lrec_coling.pdf" - | grep -F 'Common Ground Tracking in Multimodal Dialogue'

          sha256sum "$out"/*.pdf

      - name: Register append-only source intake
        if: steps.gate.outputs.already_present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          from pathlib import Path

          root = Path('.')
          source_dir = root / 'imports/raw/literature/REV-003A'
          files = [
              {
                  'import_id': 'IMP-0022',
                  'source_id': 'SRC-0002',
                  'filename': 'SRC-0002_asher_lascarides_2008_londial.pdf',
                  'title': 'Commitments, Beliefs and Intentions in Dialogue',
                  'version': 'Author-hosted copy of LONDIAL 2008 proceedings paper; 8 PDF pages',
                  'url': 'https://homepages.inf.ed.ac.uk/alex/papers/londial.pdf',
              },
              {
                  'import_id': 'IMP-0023',
                  'source_id': 'SRC-0003',
                  'filename': 'SRC-0003_venant_asher_2015_iwcs.pdf',
                  'title': 'Dynamics of Public Commitments in Dialogue',
                  'version': 'ACL Anthology W15-0131; IWCS 2015; 11 PDF pages',
                  'url': 'https://aclanthology.org/W15-0131.pdf',
              },
              {
                  'import_id': 'IMP-0024',
                  'source_id': 'SRC-0010',
                  'filename': 'SRC-0010_khebour_et_al_2024_lrec_coling.pdf',
                  'title': 'Common Ground Tracking in Multimodal Dialogue',
                  'version': 'ACL Anthology 2024.lrec-main.318; LREC-COLING 2024; 16 PDF pages',
                  'url': 'https://aclanthology.org/2024.lrec-main.318.pdf',
              },
          ]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          for item in files:
              path = source_dir / item['filename']
              if not path.is_file():
                  raise SystemExit(f'missing downloaded source: {path}')
              item['path'] = path.as_posix()
              item['sha256'] = sha256(path)
              item['size_bytes'] = str(path.stat().st_size)

          manifest_path = root / 'imports/manifest.csv'
          with manifest_path.open(newline='', encoding='utf-8') as stream:
              reader = csv.DictReader(stream)
              manifest_fields = reader.fieldnames
              rows = list(reader)
          assert manifest_fields is not None

          existing_ids = {row['import_id'] for row in rows}
          existing_paths = {row['stored_path'] for row in rows}
          for item in files:
              if item['import_id'] in existing_ids:
                  raise SystemExit(f"import ID already used: {item['import_id']}")
              if item['path'] in existing_paths:
                  raise SystemExit(f"stored path already registered: {item['path']}")
              rows.append({
                  'import_id': item['import_id'],
                  'original_filename': item['filename'],
                  'stored_path': item['path'],
                  'sha256': item['sha256'],
                  'size_bytes': item['size_bytes'],
                  'media_type': 'application/pdf',
                  'duplicate_of': '',
                  'import_status': 'included',
                  'authority_role': 'full_text_audit_source',
                  'notes': f"{item['source_id']}; {item['version']}. Exact source identity and controls verified at intake; presence does not constitute a mechanism audit. Source URL: {item['url']}",
              })

          with manifest_path.open('w', newline='', encoding='utf-8') as stream:
              writer = csv.DictWriter(stream, fieldnames=manifest_fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          sources_path = root / 'data/sources.csv'
          with sources_path.open(newline='', encoding='utf-8') as stream:
              reader = csv.DictReader(stream)
              source_fields = reader.fieldnames
              source_rows = list(reader)
          assert source_fields is not None

          by_id = {item['source_id']: item for item in files}
          seen = set()
          for row in source_rows:
              source_id = row['source_id']
              if source_id not in by_id:
                  continue
              item = by_id[source_id]
              seen.add(source_id)
              if row['verification_status'] == 'fulltext_verified':
                  raise SystemExit(f'{source_id} unexpectedly already audited')
              row['verification_status'] = 'imported_unverified'
              row['retrieval_status'] = 'raw_full_text_available_pending_audit'
              row['notes'] = (
                  f"Exact full text staged for REV-003A at {item['path']} "
                  f"(SHA-256 {item['sha256']}; {item['size_bytes']} bytes). "
                  f"Version: {item['version']}. Zotero remains bibliographic metadata authority. "
                  "Mechanism findings, locators, provenance relations, and novelty implications remain pending full-text audit."
              )

          missing = set(by_id) - seen
          if missing:
              raise SystemExit(f'missing source rows: {sorted(missing)}')

          with sources_path.open('w', newline='', encoding='utf-8') as stream:
              writer = csv.DictWriter(stream, fieldnames=source_fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(source_rows)

          readme = source_dir / 'README.md'
          readme.write_text(
              '# REV-003A exact full-text intake\n\n'
              'These files are controlled source inputs for the REV-003A mechanism audit. Their presence authorizes scoped reading but does not verify any mechanism, claim, or novelty conclusion.\n\n'
              '## Sources\n\n' + ''.join(
                  f"- `{item['source_id']}` - *{item['title']}*; `{item['filename']}`; "
                  f"SHA-256 `{item['sha256']}`; {item['size_bytes']} bytes; {item['version']}; "
                  f"source `{item['url']}`.\n"
                  for item in files
              ) +
              '\n## Boundary\n\n'
              '- Audit every affirmative mechanism statement against the committed PDF with a page or section locator.\n'
              '- Do not treat source presence as `fulltext_verified`.\n'
              '- Do not change `NOV-0001` from `candidate` during intake.\n'
              '- Do not revise proposal prose or prototype code during this operation.\n',
              encoding='utf-8',
          )

          handoff = root / 'workflow/handoffs/REV-003A_fulltext_intake.md'
          handoff.write_text(
              '# REV-003A exact full-text intake handoff\n\n'
              '## Scope\n\n'
              'This operation stages exact full-text inputs for `SRC-0002`, `SRC-0003`, and `SRC-0010`. '
              'It does not perform the thirteen-field mechanism audit and does not change `NOV-0001`.\n\n'
              '## Source controls\n\n' + ''.join(
                  f"- **{item['source_id']}** - *{item['title']}*; path `{item['path']}`; "
                  f"SHA-256 `{item['sha256']}`; size `{item['size_bytes']}` bytes; {item['version']}.\n"
                  for item in files
              ) +
              '\n## Next authorized operation\n\n'
              'After this intake PR is reviewed and merged, run the REV-003A exact full-text mechanism audit. '
              'Create source cards for `SRC-0002`, `SRC-0003`, and `SRC-0010`, update only locator-backed registers, '
              'retain `NOV-0001` as `candidate`, and do not begin Prompt C until the combined Tier 1 synthesis is reviewed.\n',
              encoding='utf-8',
          )
          PY

      - name: Validate evidence repository
        if: steps.gate.outputs.already_present == 'false'
        run: |
          python scripts/validate_registers.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit source intake to branch
        if: steps.gate.outputs.already_present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imports/raw/literature/REV-003A imports/manifest.csv data/sources.csv workflow/handoffs/REV-003A_fulltext_intake.md
          git commit -m 'Stage exact REV-003A full-text sources'
          git push origin HEAD:${{ github.head_ref }}
